name: Publish npm package

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve publication
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Set up dependency-free resolver
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0

      - name: Resolve version and npm history
        id: plan
        run: node scripts/release.ts resolve

  verify:
    name: Prepare package
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Explicit manual validation
        if: github.event_name == 'workflow_dispatch'
        run: npm run test

      - name: Build package once
        run: npm run build

      - name: Pack the built package without rebuilding
        run: |
          mkdir -p .npm-packages
          npm pack --ignore-scripts --pack-destination .npm-packages
          cp package-lock.json .npm-packages/dependency-lock.json

      - name: Record archive integrity and release metadata
        id: record
        run: node --import tsx scripts/release.ts record

      - name: Upload immutable package and metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: .npm-packages/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  publish:
    name: Publish package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the exact packed archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: .npm-packages

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - name: Use pinned npm for publishing
        run: npm install -g npm@11.6.2

      - name: Verify archive against the build job digest
        id: archive
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: node scripts/release.ts verify

      - name: Recheck npm history before publishing
        id: plan
        run: node scripts/release.ts registry

      - name: Publish the verified archive
        if: steps.plan.outputs.publish == 'true'
        env:
          TARBALL: ${{ steps.archive.outputs.tarball }}
        run: npm publish "./${TARBALL}" --ignore-scripts --access public --provenance
