name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release ref
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "Manual npm publishing must be dispatched from main." >&2
              exit 1
            fi
          else
            if ! printf '%s' "${GITHUB_REF}" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Npm publishing tags must use vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Npm publishing ref must point at a commit contained in origin/main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm run test
          npm run build

      - name: Pack package
        run: |
          set -euo pipefail
          mkdir -p .npm-packages
          npm pack --pack-destination .npm-packages

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .npm-packages/*.tgz
          if-no-files-found: error

  publish:
    name: Publish package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .npm-packages

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - name: Use pinned npm for publishing
        run: npm install -g npm@11.6.2

      - name: Publish package
        run: |
          set -euo pipefail

          shopt -s nullglob
          tarballs=(.npm-packages/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly 1 npm package tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi

          tarball="${tarballs[0]}"
          package_name="$(tar -xOf "${tarball}" package/package.json | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).name));")"
          package_version="$(tar -xOf "${tarball}" package/package.json | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"

          if [ "${package_name}" != "@companyhelm/cli" ]; then
            echo "Unexpected package in publish artifact: ${package_name}" >&2
            exit 1
          fi

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping."
            exit 0
          fi

          echo "Publishing ${package_name}@${package_version} from ${tarball}."
          npm publish "${tarball}" --access public --provenance
